[project]
name = "camerino-adapters"
version = "0.1.0"
description = "Camerino adapters: SourceAdapter, TryOnProvider, CheckoutProvider, Notifier"
requires-python = ">=3.12"
dependencies = [
    "camerino-domain",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camerino"]
