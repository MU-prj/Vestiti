[project]
name = "camerino-worker"
version = "0.1.0"
description = "Camerino background worker (ARQ)"
requires-python = ">=3.12"
dependencies = [
    "camerino-domain",
    "camerino-adapters",
    "arq>=0.26",
    "redis>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camerino"]
