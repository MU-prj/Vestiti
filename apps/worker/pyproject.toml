[project]
name = "camerino-worker"
version = "0.1.0"
description = "Camerino background worker (ARQ + Redis)"
requires-python = ">=3.12"
dependencies = [
  "arq>=0.26",
  "camerino-domain",
  "camerino-api",
]

[tool.uv.sources]
camerino-domain = { workspace = true }
camerino-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camerino_worker"]
