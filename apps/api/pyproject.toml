[project]
name = "camerino-api"
version = "0.1.0"
description = "Camerino FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "camerino-domain",
    "camerino-color",
    "camerino-adapters",
    "fastapi>=0.115",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camerino"]
