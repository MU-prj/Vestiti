[project]
name = "camerino"
version = "0.0.0"
description = "Camerino monorepo root (virtual workspace package)"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "apps/api",
  "apps/worker",
  "packages/domain",
  "packages/color",
]

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "httpx>=0.28",
  "pre-commit>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
  "apps/api/src",
  "apps/worker/src",
  "packages/domain/src",
  "packages/color/src",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_unreachable = true

[tool.pytest.ini_options]
addopts = "-q --cov=camerino_domain --cov=camerino_color --cov-report=term-missing --cov-fail-under=85"
testpaths = [
  "apps/api/tests",
  "apps/worker/tests",
  "packages/domain/tests",
  "packages/color/tests",
]

[tool.coverage.report]
show_missing = true
