name: Migrations

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reversibility:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: camerino
          POSTGRES_PASSWORD: camerino
          POSTGRES_DB: camerino
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U camerino -d camerino"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://camerino:camerino@localhost:5432/camerino
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages
      - name: Upgrade to head
        run: uv run alembic -c apps/api/alembic.ini upgrade head
      - name: Downgrade to base
        run: uv run alembic -c apps/api/alembic.ini downgrade base
      - name: Re-upgrade to head
        run: uv run alembic -c apps/api/alembic.ini upgrade head
